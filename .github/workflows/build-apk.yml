name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔨 Generate Native Android Project (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Stage APK for Download
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Aapka-PG.apk

      - name: 📤 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aapka-PG-Android-APK
          path: output/Aapka-PG.apk
          retention-days: 30
